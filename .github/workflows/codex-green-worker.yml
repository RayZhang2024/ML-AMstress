name: GREEN Codex issue worker

on:
  issues:
    types: [labeled]

# The worker needs to create/push one branch, update the issue claim/status,
# and open one PR. It contains no merge operation.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-green-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-green-worker:
    if: github.event.label.name == 'agent:codex'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_COMMAND: codex exec --full-auto
      CODEX_CLI_PACKAGE: ${{ vars.CODEX_CLI_PACKAGE }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install normal-Python worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt5>=5.15" "numpy>=1.21" "matplotlib>=3.4" "joblib>=1.1"

      - name: Install approved Codex CLI
        run: |
          if [ -z "$CODEX_CLI_PACKAGE" ]; then
            echo "::error::Repository variable CODEX_CLI_PACKAGE must name a maintainer-approved pinned package."
            exit 1
          fi
          npm install --global "$CODEX_CLI_PACKAGE"

      - name: Run fail-closed GREEN worker
        run: python scripts/codex_issue_worker.py
