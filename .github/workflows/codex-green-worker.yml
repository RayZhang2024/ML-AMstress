name: GREEN Codex issue worker

on:
  issues:
    types: [labeled]

# The worker needs to create/push one branch, update the issue claim/status,
# and open one PR. It contains no merge operation.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-green-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-green-worker:
    if: github.event.label.name == 'agent:codex'
    runs-on: [self-hosted, windows, x64, ml-amstress-codex]
    timeout-minutes: 45
    env:
      CODEX_EXECUTABLE: codex
      CODEX_EXPECTED_VERSION: ${{ vars.CODEX_EXPECTED_VERSION }}
      CODEX_EXPECTED_RUNNER_NAME: ${{ vars.CODEX_EXPECTED_RUNNER_NAME }}
      CODEX_EXPECTED_WINDOWS_USER: ${{ vars.CODEX_EXPECTED_WINDOWS_USER }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # Never persist the write-capable Actions token in .git/config. The
          # worker injects it only for its trusted post-Codex push operation.
          persist-credentials: false
        # Scope checkout itself to the deterministic policy used by isolated
        # probes. These environment overrides are confined to this step.
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf

      - name: Persist repository-local Git line endings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Checkout already materialized the worktree under these values.
          # Persist them only locally for isolated Git probes.
          git config --local core.autocrlf false
          git config --local core.eol lf

      - name: Verify local Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python -CommandType Application -ErrorAction SilentlyContinue
          if ($null -eq $python) {
            Write-Error "Local Python executable is not available on PATH."
            exit 1
          }
          try {
            & $python.Source scripts/codex_issue_worker.py --verify-local-python
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Local Python executable could not report a supported version."
              exit 1
            }
          }
          catch {
            Write-Error "Local Python executable could not run."
            exit 1
          }

      - name: Install normal-Python worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt5>=5.15" "numpy>=1.21" "matplotlib>=3.4" "joblib>=1.1"

      - name: Diagnose isolated workspace cleanliness
        shell: powershell
        run: python scripts/codex_issue_worker.py --diagnose-workspace

      - name: Run fail-closed GREEN worker
        run: python scripts/codex_issue_worker.py
        env:
          # The worker strips this token before Codex and injects it only for
          # final push/API operations.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
