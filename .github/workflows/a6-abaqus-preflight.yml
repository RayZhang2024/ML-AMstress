name: A6.1 trusted Abaqus runner preflight

on:
  workflow_dispatch:

# This preflight reads only trusted main control-plane content.  It has no
# issue, pull-request, contents-write, merge, or App-token operation.
permissions:
  contents: read

concurrency:
  group: a6-1-abaqus-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-trusted-abaqus-runner:
    # A manually dispatched workflow may otherwise be selected from another
    # ref. Never execute that ref or a fork/PR checkout on the Abaqus runner.
    if: github.repository == 'RayZhang2024/ML-AMstress' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, ml-amstress-abaqus]
    timeout-minutes: 5
    env:
      A6_APPROVED_LAUNCHER: C:/SIMULIA/Commands/abq2021.bat
      A6_EXPECTED_RUNNER_NAME: ${{ vars.A6_EXPECTED_RUNNER_NAME }}
      A6_EXPECTED_WINDOWS_USER: ${{ vars.A6_EXPECTED_WINDOWS_USER }}
      A6_TIMEOUT_SECONDS: "60"
    steps:
      - name: Check out trusted main control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run bounded Abaqus 2021 preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & python -m scripts.a6_abaqus_preflight
          $exitCode = $LASTEXITCODE
          if ($null -eq $output -or $output.Count -ne 1 -or
              -not $output[0].StartsWith('A6_PREFLIGHT_EVIDENCE=')) {
            Write-Error 'A6.1 preflight did not return bounded evidence.'
            exit 1
          }
          $output[0] | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Output $output[0]
          exit $exitCode
