name: A6.2 trusted exact-PR Abaqus validation

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: Exact same-repository PR number
        required: true
        type: string
      target_issue_number:
        description: Exact linked issue number
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      validation_profile:
        description: Trusted profile identifier
        required: true
        type: choice
        options:
          - inert-cae-runtime-probe

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: a6-2-exact-pr-${{ github.event.inputs.target_pr_number }}-${{ github.event.inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  metadata-gate:
    if: github.repository == 'RayZhang2024/ML-AMstress' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      target_head_sha: ${{ steps.gate.outputs.target_head_sha }}
    env:
      A6_TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
      A6_TARGET_ISSUE_NUMBER: ${{ inputs.target_issue_number }}
      A6_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      A6_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
    steps:
      - name: Check out trusted main controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve bounded trusted metadata
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$(python -m scripts.a6_pr_validation --metadata-gate)"
          if [ "$(printf '%s\n' "$output" | wc -l)" -ne 1 ] || [[ "$output" != A6_PR_AUTHORIZATION=* ]]; then
            echo 'A6.2 metadata gate did not return bounded authorization.' >&2
            exit 1
          fi
          printf '%s\n' "$output" >> "$GITHUB_STEP_SUMMARY"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo "target_head_sha=${{ inputs.expected_head_sha }}" >> "$GITHUB_OUTPUT"

  validate-exact-pr:
    needs: metadata-gate
    if: needs.metadata-gate.outputs.authorized == 'true' && github.repository == 'RayZhang2024/ML-AMstress' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, ml-amstress-abaqus]
    timeout-minutes: 8
    env:
      A6_APPROVED_LAUNCHER: C:/SIMULIA/Commands/abq2021.bat
      A6_EXPECTED_RUNNER_NAME: ${{ vars.A6_EXPECTED_RUNNER_NAME }}
      A6_EXPECTED_WINDOWS_USER: ${{ vars.A6_EXPECTED_WINDOWS_USER }}
      A6_TIMEOUT_SECONDS: "60"
      A6_TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
      A6_TARGET_ISSUE_NUMBER: ${{ inputs.target_issue_number }}
      A6_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      A6_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
    steps:
      - name: Check out trusted main controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded trusted A6.2 controller
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$output = @(& python -m scripts.a6_pr_validation)
          $exitCode = $LASTEXITCODE
          if ($null -eq $output -or $output.Count -ne 1 -or
              -not $output[0].StartsWith('A6_PR_VALIDATION_EVIDENCE=')) {
            Write-Error 'A6.2 validation did not return bounded evidence.'
            exit 1
          }
          $output[0] | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Output $output[0]
          exit $exitCode
